# SHOPCRM monorepo — конфигурация инструментов (ruff, pytest).
# Пакеты: packages/core (shopcrm-core), apps/bot (shopcrm-bot).
# Установка: pip install -e packages/core -e apps/bot

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# RUF001/002/003 (ambiguous unicode) не включаем: в проекте русские docstring/комментарии.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF013", "RUF022"]

# pytest настраивается в pytest.ini (единственный источник).
