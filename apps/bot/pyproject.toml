[project]
name = "shopcrm-bot"
version = "0.1.0"
description = "SHOPCRM Telegram bot (aiogram)"
requires-python = ">=3.11"
dependencies = [
    "shopcrm-core",
    "aiogram>=3.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
